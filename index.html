<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IndianTools — India's Own File Toolkit | 100% Client-Side PDF & Image Tools</title>
    <meta name="description" content="Free, instant, privacy-first PDF and image converter tools. Convert PDF to JPG, Merge PDF, Compress Image & more. Files are processed entirely in your browser and never uploaded." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Deferred Third-Party Scripts (AdSense & Google Analytics) to optimize PageSpeed -->
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          // Google Analytics (gtag.js)
          const gaScript = document.createElement('script');
          gaScript.async = true;
          gaScript.src = "https://www.googletagmanager.com/gtag/js?id=G-RC0YZ37VG3";
          document.head.appendChild(gaScript);

          const gaConfig = document.createElement('script');
          gaConfig.innerHTML = `
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-RC0YZ37VG3');
          `;
          document.head.appendChild(gaConfig);

          // Google AdSense
          const adsScript = document.createElement('script');
          adsScript.async = true;
          adsScript.crossOrigin = "anonymous";
          adsScript.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7088142164047358";
          document.head.appendChild(adsScript);
        }, 2500);
      });
    </script>
  </head>
  <body class="bg-gray-50 text-charcoal font-sans antialiased selection:bg-saffron-100 selection:text-saffron-700 min-h-screen flex flex-col">
    <div id="root" class="flex flex-col min-h-screen"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
